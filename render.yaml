
services:
  - type: web
    name: riskinsight
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: llm
      - key: LLM_API_STYLE
        value: openai
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: inclusionai/ling-3.2-flash:free
      - key: LLM_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: SEED_LOANS
        value: "10000"
      - key: MAX_CONCURRENT_REQUESTS
        value: "2"
      - key: REQUESTS_PER_MINUTE
        value: "12"
      - key: LLM_TIMEOUT_SECONDS
        value: "300"
      - key: MAX_OUTPUT_TOKENS
        value: "2048"
